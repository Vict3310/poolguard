[package]
name = "poolguard"
version = "0.1.0"
edition = "2021"
description = "PoolGuard: shared task budgets for multiple agents, enforced on NEAR"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.0.0", features = ["derive"] }
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
serde_json = "1"

# The sandbox integration suite uses the official near-sandbox binary through
# TypeScript (scripts/sandbox). near-workspaces-rs is avoided because it pulls in
# openssl-sys, which needs system headers many CI images do not have.

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
# Do not use panic = "abort": NEAR needs the panic string to return stable
# denial codes (INSUFFICIENT_AVAILABLE_BUDGET, PROVIDER_NOT_ALLOWED, …) instead
# of a bare "WebAssembly trap" with no machine-readable reason.
overflow-checks = true
