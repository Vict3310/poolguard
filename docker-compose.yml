# Local PostgreSQL only. The NEAR sandbox is not a container.
services:
  postgres:
    image: postgres:18-alpine
    container_name: poolguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poolguard
      POSTGRES_PASSWORD: poolguard
      POSTGRES_DB: poolguard
    ports:
      - "55432:5432"
    volumes:
      - poolguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolguard -d poolguard"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  poolguard-postgres:
